name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-binary:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            ext: ""
          - os: macos-latest
            platform: macos
            arch: arm64
            ext: ""
          - os: windows-latest
            platform: win
            arch: x64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - run: npm ci

      # Generate version.ts from tag
      - name: Set version in source
        shell: bash
        run: echo "export const VERSION = \"${{ steps.version.outputs.VERSION }}\";" > src/version.ts

      - run: npm run build

      # Bundle with esbuild + libsql stub
      - name: Bundle
        shell: bash
        run: npx esbuild dist/index.js --bundle --platform=node --target=node22 --outfile=sea-bundle.cjs --format=cjs --alias:libsql=./stubs/libsql.mjs

      # Create Node.js SEA binary
      - name: Create SEA binary
        shell: bash
        run: |
          BINARY="libsql-mcp-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}"

          # Create sea-config
          cat > sea-config.json << EOF
          {
            "main": "sea-bundle.cjs",
            "output": "sea-prep.blob"
          }
          EOF

          # Generate blob
          node --experimental-sea-config sea-config.json

          # Copy node binary
          cp "$(which node)" "$BINARY"

          # Platform-specific injection
          if [ "${{ matrix.platform }}" = "macos" ]; then
            codesign --remove-signature "$BINARY"
            npx postject "$BINARY" NODE_SEA_BLOB sea-prep.blob \
              --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
              --macho-segment-name NODE_SEA
            codesign --sign - "$BINARY"
          elif [ "${{ matrix.platform }}" = "win" ]; then
            npx postject "$BINARY" NODE_SEA_BLOB sea-prep.blob \
              --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          else
            npx postject "$BINARY" NODE_SEA_BLOB sea-prep.blob \
              --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
            chmod +x "$BINARY"
          fi

      - name: Verify binary
        shell: bash
        run: |
          BINARY="libsql-mcp-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}"
          ls -lh "$BINARY"
          if [ "${{ matrix.platform }}" != "win" ]; then
            "./$BINARY" --version
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: libsql-mcp-${{ matrix.platform }}-${{ matrix.arch }}
          path: libsql-mcp-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}

  publish-npm:
    needs: build-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - run: npm ci

      - name: Set version in source
        run: echo "export const VERSION = \"${{ steps.version.outputs.VERSION }}\";" > src/version.ts

      - run: npm run build
      - run: npm version --no-git-tag-version ${{ steps.version.outputs.VERSION }}
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: build-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Organize release files
        run: |
          mkdir -p release
          for dir in artifacts/libsql-mcp-*/; do
            cp ${dir}* "release/"
          done
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
